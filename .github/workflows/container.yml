name: Build container image

# Publishes to the GitHub Container Registry so collaborators can run
#     apptainer pull docker://ghcr.io/<owner>/repogen:<version>
# on any HPC system without building anything themselves.
#
# Tags trigger a published release image; pushes and pull requests build
# without publishing, so a broken Dockerfile is caught before a release.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "envs/Dockerfile"
      - "envs/repogen.linux-64.lock"
      - "envs/repogen-pip.linux-64.txt"
      - "repogen/**"
      - "workflows/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "envs/Dockerfile"
      - "envs/repogen.linux-64.lock"
      - "envs/repogen-pip.linux-64.txt"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        # The conda environment plus base image approaches the runner's free
        # space; the preinstalled Android/.NET toolchains are not needed here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Derive image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0.dev0+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only needed by the publish step, which runs on release tags.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/Dockerfile
          load: true
          push: false
          tags: repogen:ci
          build-args: |
            REPOGEN_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image actually works
        # A published image that cannot run the pipeline is worse than no
        # image, so these checks gate the push.
        run: |
          set -euo pipefail
          echo "--- version ---"
          docker run --rm repogen:ci repogen --version
          echo "--- dependency report ---"
          docker run --rm repogen:ci repogen info
          echo "--- external tools ---"
          docker run --rm repogen:ci plink --version
          echo "--- MAGMA must be absent (licence forbids redistribution) ---"
          if docker run --rm repogen:ci bash -lc "command -v magma"; then
            echo "ERROR: MAGMA is present in the image; it must not be redistributed" >&2
            exit 1
          fi
          echo "--- test suite inside the image ---"
          docker run --rm repogen:ci python -m pytest tests/ -q --no-header \
            -p no:cacheprovider

      - name: Push image
        # Publish on release tags only. Every other event builds and tests
        # without publishing: while the repository is private the package is
        # private too, and private package storage is far smaller than this
        # ~2-3 GB image. Tag a release when the work is public.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPOGEN_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
